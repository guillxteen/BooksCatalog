name: bookscatalog

services:
  main_service:
    build:
      context: .
      dockerfile: main_service/Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/catalog.db
    ports:
      - "8000:8000"
    volumes:
      - catalog_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  report_service:
    build:
      context: .
      dockerfile: report_service/Dockerfile
    environment:
      MAIN_SERVICE_URL: http://main_service:8000
      FRONTEND_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    ports:
      - "8001:8001"
    depends_on:
      main_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  catalog_data:

